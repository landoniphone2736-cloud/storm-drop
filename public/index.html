<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Storm Drop .io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#3b8fd6;color:#fff;font-family:'Fredoka',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;left:0;top:0;cursor:crosshair}
.hide{display:none!important}
.out{text-shadow:0 2px 0 #0006,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
#hud{position:fixed;inset:0;pointer-events:none;font-weight:600}
.panel{background:rgba(20,24,36,.55);border-radius:12px;border:2px solid rgba(255,255,255,.12)}
#tl{position:absolute;left:14px;top:14px;display:flex;gap:8px}
#tl .panel{padding:6px 12px;font-size:18px;display:flex;align-items:center;gap:6px}
#tl .ic{font-size:14px;opacity:.8}
#stormtxt{position:absolute;left:14px;top:58px;font-size:14px;padding:5px 12px;color:#e7c8ff}
#mm{position:absolute;right:14px;top:14px;width:150px;height:150px;border-radius:12px;border:3px solid rgba(255,255,255,.7);box-shadow:0 4px 0 #0005;background:#3b8fd6}
#feed{position:absolute;right:14px;top:176px;width:320px;text-align:right;font-size:13px;line-height:22px}
#feed div{background:rgba(20,24,36,.6);display:inline-block;padding:2px 10px;border-radius:8px;margin-bottom:4px;animation:fade 6s forwards}
#feed b{color:#ffd84a}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
#cmsg{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:44px;font-weight:700;color:#ffd84a}
#csub{position:absolute;left:0;right:0;top:calc(22% + 58px);text-align:center;font-size:18px;line-height:28px}
#prompt{position:absolute;left:0;right:0;bottom:178px;text-align:center;font-size:16px}
#prompt span{background:rgba(20,24,36,.7);padding:6px 14px;border-radius:10px}
#prompt i{font-style:normal;background:#fff;color:#222;border-radius:5px;padding:0 6px;margin-right:6px}
#bot{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px}
#prog{width:220px;height:10px;border-radius:6px;background:#0007;overflow:hidden;visibility:hidden}
#prog i{display:block;height:100%;width:0;background:#ffd84a}
#progl{font-size:13px;height:16px}
#bars{width:340px;display:flex;flex-direction:column;gap:4px}
.bar{height:12px;background:rgba(0,0,0,.5);border-radius:7px;overflow:hidden;position:relative;border:2px solid rgba(0,0,0,.4)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#6cc4ff,#2f8be0);transition:width .15s}
.bar.hp{height:20px}
.bar.hp i{background:linear-gradient(#8dff8a,#36c14a)}
#hpt{position:absolute;left:0;right:0;top:0;text-align:center;font-size:13px;line-height:17px}
#row{display:flex;gap:6px;align-items:flex-end}
.slot{width:84px;height:56px;border-radius:10px;background:rgba(20,24,36,.6);border:3px solid rgba(255,255,255,.15);padding:4px 6px;font-size:12px;line-height:15px;position:relative;overflow:hidden}
.slot.on{border-color:#fff;transform:translateY(-4px)}
.slot .k{position:absolute;right:5px;top:2px;font-size:11px;opacity:.6}
.slot .nm{margin-top:12px}
.slot .am{opacity:.8;font-size:11px}
.cons{display:flex;flex-direction:column;gap:3px;margin-left:6px}
.cons div{background:rgba(20,24,36,.6);border-radius:8px;padding:2px 8px;font-size:12px;display:flex;gap:6px;align-items:center;min-width:88px}
.cons small{opacity:.6;margin-left:auto}
#snd{position:absolute;left:14px;bottom:14px;pointer-events:auto;font:600 12px Fredoka,system-ui,sans-serif;background:rgba(20,24,36,.6);color:#fff;border:2px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 10px;cursor:pointer}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 50px rgba(255,0,0,.5);opacity:0;transition:opacity .25s}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(30,60,110,.45),rgba(10,20,40,.85));z-index:5;padding:12px}
.box{background:linear-gradient(#2b3550,#1d2438);border-radius:22px;border:4px solid #fff3;padding:26px;text-align:center;max-width:430px;width:100%;box-shadow:0 10px 0 #0006,0 30px 80px #0008}
h1{font-size:54px;line-height:52px;font-weight:700;color:#ffd84a;text-shadow:0 5px 0 #c76a1e,0 9px 0 #0006;letter-spacing:1px}
h1 span{color:#6cc4ff;font-size:28px;text-shadow:0 3px 0 #1f5c9e}
.tag{font-size:14px;color:#c8d6ff;margin:14px 0 16px;font-weight:500}
#nm{font:600 20px Fredoka,system-ui,sans-serif;width:100%;padding:12px;background:#11162a;color:#fff;border:3px solid #fff2;border-radius:12px;text-align:center;outline:none;text-transform:uppercase}
#nm:focus{border-color:#ffd84a}
#cols{display:flex;justify-content:center;gap:8px;margin:14px 0}
#cols div{width:30px;height:30px;border-radius:50%;border:3px solid #111;cursor:pointer;box-shadow:0 3px 0 #0006}
#cols div.on{outline:3px solid #fff;outline-offset:2px}
#play{font:700 28px Fredoka,system-ui,sans-serif;width:100%;padding:12px;background:linear-gradient(#ffe066,#ffb627);color:#5a2d00;border:none;border-radius:14px;box-shadow:0 6px 0 #c76a1e;cursor:pointer;margin-top:4px}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #c76a1e}
#net{font-size:13px;color:#8f8;margin-top:14px}
.ctl{font-size:12px;color:#aab;line-height:19px;margin-top:12px;font-weight:500}
#touch{position:fixed;inset:0;pointer-events:none;z-index:3}
.tbtn{position:absolute;pointer-events:auto;width:60px;height:60px;border-radius:50%;background:rgba(20,24,36,.55);border:3px solid #fff6;color:#fff;font:600 12px Fredoka,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid #fff5;background:#0003;display:none}
#joyk{position:absolute;width:48px;height:48px;border-radius:50%;background:#fff8;left:33px;top:33px}
@media (max-width:700px){#feed{width:210px;font-size:11px}#mm{width:100px;height:100px}#bars{width:250px}.slot{width:60px;font-size:10px}.cons div{min-width:64px;font-size:10px}#cmsg{font-size:28px}h1{font-size:40px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hurt"></div>
<div id="hud" class="hide">
  <div id="tl" class="out">
    <div class="panel"><span class="ic">&#128100;</span><span id="alive">0</span></div>
    <div class="panel"><span class="ic">&#128128;</span><span id="kills">0</span></div>
    <div class="panel"><span class="ic">&#127760;</span><span id="online">1</span></div>
  </div>
  <div id="stormtxt" class="panel out hide"></div>
  <canvas id="mm" width="150" height="150"></canvas>
  <div id="feed" class="out"></div>

  <div id="csub" class="out"></div>
  <div id="prompt" class="out"></div>
  <div id="bot" class="out">
    <div id="progl"></div>
    <div id="prog"><i id="progb"></i></div>
    <div id="bars">
      <div class="bar"><i id="shb" style="width:0"></i></div>

      <div class="slot" id="s0"></div><div class="slot" id="s1"></div><div class="slot" id="s2"></div><div class="slot" id="s3"></div>
      <div class="cons">
        <div>&#129657; <span id="cb">0</span><small>Q</small></div>
        <div>&#10010; <span id="cm">0</span><small>Q</small></div>
      </div>
      <div class="cons">
        <div style="color:#9fd8ff">&#9670; <span id="cs">0</span><small>F</small></div>
        <div style="color:#6cb6ff">&#11042; <span id="cg">0</span><small>F</small></div>
      </div>
    </div>
  </div>
  <button id="snd">&#128266; SOUND ON</button>
</div>
<div id="touch" class="hide">
  <div id="joy"><div id="joyk"></div></div>
  <div class="tbtn" id="tJump" style="right:24px;bottom:160px">JUMP</div>
  <div class="tbtn" id="tE" style="right:96px;bottom:210px">E</div>
  <div class="tbtn" id="tSwap" style="right:24px;bottom:232px">SWAP</div>
  <div class="tbtn" id="tMed" style="right:168px;bottom:210px">HEAL</div>
  <div class="tbtn" id="tShd" style="right:168px;bottom:138px">SHIELD</div>
</div>
<div id="menu">
  <div class="box">
    <h1>STORM<br>DROP<span>.io</span></h1>
    <p class="tag">Parachute in &middot; smash crates &middot; grab legendary loot &middot; be the last one standing</p>
    <input id="nm" maxlength="12" placeholder="YOUR NAME" autocomplete="off">
    <div id="cols"></div>
    <button id="play">PLAY</button>
    <div id="net">Connecting&hellip;</div>
    <div class="ctl">WASD move &middot; Mouse aim &middot; Click shoot / punch<br>Space jump &middot; E open chest / pick up &middot; 1-4 or wheel switch<br>R reload &middot; Q heal &middot; F shield</div>
  </div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2;
let S=2.5,DPR=1,VW=560,VH=330;
function resize(){
  const w=innerWidth,h=innerHeight;DPR=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';
  S=Math.max(w/560,h/330);if(w<700)S=Math.max(w/420,h/300);
  VW=w/S;VH=h/S;
}
addEventListener('resize',resize);resize();

// ---------- utils
function rnd(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const now=()=>performance.now();
function segHit(x1,y1,x2,y2,cx,cy,r){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((cx-x1)*dx+(cy-y1)*dy)/l:0;t=clamp(t,0,1);return dist2(x1+dx*t,y1+dy*t,cx,cy)<r*r;}
const clean=s=>String(s||'').replace(/[^\w \-!?.#*]/g,'').slice(0,12).toUpperCase();
function pickW(r,ws){let s=0;for(const w of ws)s+=w;let x=r()*s;for(let i=0;i<ws.length;i++){x-=ws[i];if(x<0)return i;}return ws.length-1;}

// ---------- constants
const MAP=2000,PR=7,SPEED=86;
const PRE=8,SHIP=22,FALL=2.8,ENDT=9;
const PHASES=[[40,25,720],[30,22,390],[25,18,190],[20,15,80],[15,15,0]];
const DMG=[1,2,4,7,10,15,15];
const RAR=[{n:'COMMON',c:'#b9b9b9'},{n:'UNCOMMON',c:'#5fd35f'},{n:'RARE',c:'#47a4ff'},{n:'EPIC',c:'#b75cff'},{n:'LEGENDARY',c:'#ffc531'}];
const RM=[1,1.1,1.2,1.32,1.45];
const WEAP=[
 {n:'FISTS',s:'FISTS',dmg:16,rate:2.6,spd:330,range:18,spread:0,mag:0,rl:0,pel:1,tier:0,len:0,slow:1},
 {n:'PISTOL',s:'PISTOL',dmg:15,rate:4,spd:520,range:300,spread:.04,mag:12,rl:1.0,pel:1,tier:1,len:7,slow:1},
 {n:'SMG',s:'SMG',dmg:9,rate:12,spd:540,range:240,spread:.12,mag:30,rl:1.6,pel:1,tier:2,len:9,slow:1},
 {n:'SHOTGUN',s:'SHOTGUN',dmg:10,rate:1.1,spd:460,range:150,spread:.07,mag:5,rl:2.2,pel:7,tier:2,len:11,slow:1},
 {n:'ASSAULT RIFLE',s:'RIFLE',dmg:14,rate:7,spd:620,range:380,spread:.045,mag:30,rl:1.9,pel:1,tier:3,len:12,slow:1},
 {n:'SNIPER',s:'SNIPER',dmg:75,rate:.75,spd:1100,range:700,spread:0,mag:5,rl:2.5,pel:1,tier:3,len:15,slow:.95},
 {n:'MINIGUN',s:'MINIGUN',dmg:8,rate:18,spd:560,range:280,spread:.14,mag:100,rl:3.5,pel:1,tier:4,len:13,slow:.72},
];
// item codes: 1 bandage, 2 medkit, 3 small shield, 4 big shield, 100+w*10+r weapon
const CONS={1:{n:'BANDAGES',give:5,max:15},2:{n:'MEDKIT',give:1,max:3},3:{n:'SMALL SHIELD',give:2,max:6},4:{n:'BIG SHIELD',give:1,max:3}};
const isW=c=>c>=100;const cW=c=>((c-100)/10|0);const cR=c=>(c-100)%10;
const itemName=c=>isW(c)?RAR[cR(c)].n+' '+WEAP[cW(c)].n:CONS[c].n;
const COLORS=['#ff6b6b','#5aa9ff','#5fd35f','#ffd84a','#ff8ae2','#a77aff','#ff9f43','#4affe6'];
const BOTN=['ZAPPY','BLOOP','KRANK','VOLT','NIBS','RUSTY','PIXL','GLITCH','MOXIE','TURBO','FIZZ','DOZER','WOBBLE','SNACK','BONK','JUNO'];
const STI=['ship','fall','alive','dead'];
const ROOFC=['#d0573f','#3f86d0','#8a5fd0','#d09a3f','#3fb083','#c94f86'];

// ---------- map
const M={circ:[],rect:[],bush:[],bld:[],trees:[],crates:[],chests:[],patch:[],sand:[],roads:[]};
(function gen(){
  const r=rnd(77031);
  for(let i=0;i<70;i++)M.patch.push({x:r()*MAP,y:r()*MAP,r:40+r()*110});
  for(let i=0;i<16;i++)M.sand.push({x:r()*MAP,y:r()*MAP,r:50+r()*90});
  for(let i=0;i<2;i++){M.roads.push({h:true,p:400+r()*1200});M.roads.push({h:false,p:400+r()*1200});}
  for(let tries=0;M.bld.length<14&&tries<900;tries++){
    const w=96+(r()*60|0),h=84+(r()*44|0);
    const x=(60+r()*(MAP-120-w))|0,y=(60+r()*(MAP-120-h))|0;
    if(M.bld.some(b=>x<b.x+b.w+70&&x+w+70>b.x&&y<b.y+b.h+70&&y+h+70>b.y))continue;
    M.bld.push({x,y,w,h,col:ROOFC[M.bld.length%ROOFC.length],ra:1,floor:r()<.5?0:1});
  }
  const T=5,G=26;
  for(const b of M.bld){
    const {x,y,w,h}=b,hw=(w-G)/2,hh=(h-G)/2;
    const d=[r()<.75,r()<.85,r()<.5,r()<.5];if(!d.some(Boolean))d[1]=true;
    const add=(rx,ry,rw,rh)=>M.rect.push({x:rx,y:ry,w:rw,h:rh,wall:1});
    if(d[0]){add(x,y,hw,T);add(x+w-hw,y,hw,T);}else add(x,y,w,T);
    if(d[1]){add(x,y+h-T,hw,T);add(x+w-hw,y+h-T,hw,T);}else add(x,y+h-T,w,T);
    if(d[2]){add(x,y,T,hh);add(x,y+h-hh,T,hh);}else add(x,y,T,h);
    if(d[3]){add(x+w-T,y,T,hh);add(x+w-T,y+h-hh,T,hh);}else add(x+w-T,y,T,h);
    b.doors=[];const cx=x+w/2,cy=y+h/2;if(d[0])b.doors.push({ox:cx,oy:y-14,ix:cx,iy:y+14});if(d[1])b.doors.push({ox:cx,oy:y+h+14,ix:cx,iy:y+h-14});if(d[2])b.doors.push({ox:x-14,oy:cy,ix:x+14,iy:cy});if(d[3])b.doors.push({ox:x+w+14,oy:cy,ix:x+w-14,iy:cy});
    M.chests.push({id:'H'+M.chests.length,x:x+w/2+(r()-.5)*(w-50),y:y+h/2+(r()-.5)*(h-50)});
    const nc=1+(r()*2|0);for(let k=0;k<nc;k++){const cx=x+16+r()*(w-32),cy=y+16+r()*(h-32);M.crates.push({id:'K'+M.crates.length,x:cx-7,y:cy-7,w:14,h:14,cx,cy});}
  }
  const inB=(x,y,m)=>M.bld.some(b=>x>b.x-m&&x<b.x+b.w+m&&y>b.y-m&&y<b.y+b.h+m);
  const far=(x,y,m)=>!M.circ.some(c=>dist2(x,y,c.x,c.y)<(c.r+m)**2)&&!M.crates.some(c=>dist2(x,y,c.cx,c.cy)<(m+10)**2);
  for(let i=0,t=0;i<190&&t<5000;t++){
    const R=15+r()*10,x=30+r()*(MAP-60),y=30+r()*(MAP-60);
    if(inB(x,y,R+6)||!far(x,y,R+8))continue;
    const tr={c:1,x,y,r:5,k:'t',R,b:[r(),r(),r()]};M.circ.push(tr);M.trees.push(tr);i++;
  }
  for(let i=0,t=0;i<120&&t<5000;t++){
    const rad=6+r()*8,x=30+r()*(MAP-60),y=30+r()*(MAP-60);
    if(inB(x,y,rad+14)||!far(x,y,rad+16))continue;
    M.circ.push({c:1,x,y,r:rad,k:'r',v:r()});i++;
  }
  for(let i=0,t=0;i<190&&t<5000;t++){
    const x=30+r()*(MAP-60),y=30+r()*(MAP-60);
    if(inB(x,y,16)||!far(x,y,18))continue;
    M.crates.push({id:'K'+M.crates.length,x:x-7,y:y-7,w:14,h:14,cx:x,cy:y});i++;
  }
  for(let i=0,t=0;i<8&&t<500;t++){const x=100+r()*(MAP-200),y=100+r()*(MAP-200);if(inB(x,y,20)||!far(x,y,20))continue;M.chests.push({id:'H'+M.chests.length,x,y});i++;}
  for(let i=0,t=0;i<100&&t<4000;t++){
    const x=30+r()*(MAP-60),y=30+r()*(MAP-60),rad=11+r()*6;
    if(inB(x,y,rad)||!far(x,y,rad))continue;
    M.bush.push({x,y,r:rad,b:r()});i++;
  }
})();
for(const c of M.crates)M.rect.push(c);
const GC=64,GN=Math.ceil(MAP/GC),grid=Array.from({length:GN*GN},()=>[]);
function gAdd(o,x0,y0,x1,y1){const m=12;for(let cy=Math.max(0,Math.floor((y0-m)/GC));cy<=Math.min(GN-1,Math.floor((y1+m)/GC));cy++)for(let cx=Math.max(0,Math.floor((x0-m)/GC));cx<=Math.min(GN-1,Math.floor((x1+m)/GC));cx++)grid[cy*GN+cx].push(o);}
for(const c of M.circ)gAdd(c,c.x-c.r,c.y-c.r,c.x+c.r,c.y+c.r);
for(const q of M.rect)gAdd(q,q.x,q.y,q.x+q.w,q.y+q.h);
const cell=(x,y)=>grid[clamp(Math.floor(y/GC),0,GN-1)*GN+clamp(Math.floor(x/GC),0,GN-1)];
let taken=new Set();
const live=o=>!(o.id&&taken.has(o.id));
function solidObj(x,y){
  if(x<0||y<0||x>MAP||y>MAP)return true;
  for(const o of cell(x,y)){
    if(o.c){if(dist2(x,y,o.x,o.y)<o.r*o.r)return o;}
    else if(x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h&&live(o))return o;
  }return null;
}
function ray(x,y,dx,dy,max){for(let d=0;d<max;d+=3){const o=solidObj(x+dx*d,y+dy*d);if(o)return{d,o};}return{d:max,o:null};}
function collide(e,r){
  for(let pass=0;pass<2;pass++){
    e.x=clamp(e.x,r,MAP-r);e.y=clamp(e.y,r,MAP-r);
    for(const o of cell(e.x,e.y)){
      if(o.c){const dx=e.x-o.x,dy=e.y-o.y,d=Math.hypot(dx,dy),m=o.r+r;if(d<m){if(d<1e-4){e.x+=m;}else{e.x=o.x+dx/d*m;e.y=o.y+dy/d*m;}}}
      else if(live(o)){
        const cx=clamp(e.x,o.x,o.x+o.w),cy=clamp(e.y,o.y,o.y+o.h),dx=e.x-cx,dy=e.y-cy,d2=dx*dx+dy*dy;
        if(d2<r*r){
          if(d2>1e-4){const d=Math.sqrt(d2);e.x=cx+dx/d*r;e.y=cy+dy/d*r;}
          else{const l=e.x-o.x,rr=o.x+o.w-e.x,t=e.y-o.y,b=o.y+o.h-e.y,mn=Math.min(l,rr,t,b);

function wsRoom(){
  return new Promise(resolve=>{
    if(!/^https?:$/.test(location.protocol))return resolve(null);
    const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
    const peers=new Map();let you=null,snap=[],ws=null,done=false,retry=1000;
    const finish=v=>{if(!done){done=true;resolve(v);}};
    const rebuild=()=>{snap=[...peers].map(([id,v])=>({peer:id,by:null,isMe:id===you,sameTab:id===you,kind:'viewer',guest:false,presence:v.p,updatedAt:v.u}));};
    const merge=(p,d)=>{const o=Object.assign({},p);for(const k in d){if(d[k]===null)delete o[k];else o[k]=d[k];}return o;};
    const api={
      peers:()=>snap,
      presence(patch){const mine=you&&peers.get(you);if(mine){mine.p=merge(mine.p,patch);mine.u=Date.now();rebuild();}
        if(ws&&ws.readyState===1){try{ws.send(JSON.stringify({t:'p',d:patch}));}catch(e){}}return Promise.resolve();},
      onPeers:()=>()=>{},
      connected:()=>!!ws&&ws.readyState===1
    };
    function connect(){
      try{ws=new WebSocket(url);}catch(e){finish(null);return;}
      ws.onopen=()=>{retry=1000;};
      ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}
        if(m.t==='hello'){const mine=you&&peers.get(you);const myP=mine?mine.p:{};you=m.you;peers.clear();
          for(const [id,p] of m.peers||[])peers.set(id,{p:p||{},u:Date.now()});
          peers.set(you,{p:myP,u:Date.now()});rebuild();
          if(Object.keys(myP).length)ws.send(JSON.stringify({t:'p',d:myP}));
          finish(api);}
        else if(m.t==='p'&&m.id!==you){let v=peers.get(m.id);if(!v){v={p:{},u:0};peers.set(m.id,v);}v.p=merge(v.p,m.d||{});v.u=Date.now();rebuild();}
        else if(m.t==='bye'){peers.delete(m.id);rebuild();}
      };
      ws.onclose=()=>{for(const k of [...peers.keys()])if(k!==you)peers.delete(k);rebuild();
        if(!done){finish(null);return;}
        setTimeout(connect,retry);retry=Math.min(retry*2,10000);};
    }
    connect();
    setTimeout(()=>finish(null),5000);
  });
}

function updateBots(dt,e,storm,humans){

  const inside=sx>40&&sy>40&&sx<MAP-40&&sy<MAP-40;
  for(const b of bots){
    if(b.st==='dead')continue;
    if(b.st==='ship'){b.x=sx;b.y=sy;if((e>=b.dropT&&inside)||shipK>=1||(shipK>.5&&!inside)){b.st='fall';b.fallT=FALL;b.x=clamp(sx,50,MAP-50);b.y=clamp(sy,50,MAP-50);const bd=M.bld[Math.random()*M.bld.length|0];if(Math.random()<.5&&bd){b.gx=bd.x+bd.w/2;b.gy=bd.y+bd.h/2;}else{b.gx=clamp(b.x+(Math.random()-.5)*900,40,MAP-40);b.gy=clamp(b.y+(Math.random()-.5)*900,40,MAP-40);}}continue;}
    if(b.st==='fall'){const dx=b.gx-b.x,dy=b.gy-b.y,d=Math.hypot(dx,dy);if(d>2){const s=Math.min(d,SPEED*1.7*dt);b.x+=dx/d*s;b.y+=dy/d*s;}b.fallT-=dt;if(b.fallT<=0){b.st='alive';collide(b,PR);b.gx=b.x;b.gy=b.y;}continue;}
    b.fireCD-=dt;b.reloadT-=dt;b.think-=dt;
    if(b.useT>0){b.useT-=dt;if(b.useT<=0){b.hp=Math.min(100,b.hp+40);b.heals--;}}
    if(b.think<=0){
      b.think=.3+Math.random()*.25;
      const tr=b.w===0?40:230;let best=null,bd=tr*tr;
      const consider=(id,x,y)=>{const d=dist2(b.x,b.y,x,y);if(d<bd){const dd=Math.sqrt(d);const h=ray(b.x,b.y,(x-b.x)/dd,(y-b.y)/dd,dd);if(h.d>=dd-4){bd=d;best=id;}}};
      if(me.st==='alive'&&playing)consider(uid,me.x,me.y);
      for(const h of humans)if(h.st==='alive')consider(h.uid,h.x,h.y);
      for(const o of bots)if(o!==b&&o.st==='alive')consider('b'+o.id,o.x,o.y);
      b.target=best;b.obj=null;
      if(Math.random()<.25)b.strafe=-b.strafe;
      const sOut=dist2(b.x,b.y,storm.nx,storm.ny)>(storm.nr*.8)**2&&(storm.state==='shrink'||storm.left<25||dist2(b.x,b.y,storm.cx,storm.cy)>(storm.r*.9)**2);
      if(sOut&&storm.nr>0){const an=Math.random()*TAU,rr=Math.random()*storm.nr*.5;b.gx=storm.nx+Math.cos(an)*rr;b.gy=storm.ny+Math.sin(an)*rr;}
      else if(!b.target){
        let bl=null,bld=(b.w===0?320:180)**2;
        for(const L of lootables){if(b.avoid.has(L.id))continue;const d=dist2(b.x,b.y,L.x,L.y);if(d<bld){const want=isW(L.c)?wScore(cW(L.c),cR(L.c))>wScore(b.w,b.r):(L.c<=2&&b.heals<3);if(want){bld=d;bl=L;}}}
        if(bl){b.gx=bl.x;b.gy=bl.y;b.goalId=bl.id;}
        else{
          let bo=null,bod=260*260;
          for(const h of M.chests){if(taken.has(h.id)||b.avoid.has(h.id))continue;const d=dist2(b.x,b.y,h.x,h.y);if(d<bod){bod=d;bo={k:'h',o:h,x:h.x,y:h.y};}}
          if(!bo&&b.w<3){let cd=150*150;for(const c of M.crates){if(taken.has(c.id)||b.avoid.has(c.id))continue;const d=dist2(b.x,b.y,c.cx,c.cy);if(d<cd){cd=d;bo={k:'c',o:c,x:c.cx,y:c.cy};}}}
          if(bo){b.obj=bo;b.gx=bo.x;b.gy=bo.y;b.goalId=bo.o.id;}
          else if(dist2(b.x,b.y,b.gx,b.gy)<100||Math.random()<.05){const an=Math.random()*TAU,rr=60+Math.random()*200;let gx=b.x+Math.cos(an)*rr,gy=b.y+Math.sin(an)*rr;if(storm.r>0&&dist2(gx,gy,storm.cx,storm.cy)>(storm.r*.85)**2){gx=lerp(gx,storm.cx,.5);gy=lerp(gy,storm.cy,.5);}b.gx=clamp(gx,20,MAP-20);b.gy=clamp(gy,20,MAP-20);}
        }
      }
      if(b.hp<60&&b.heals>0&&!b.target&&b.useT<=0)b.useT=2.5;
      const crateWork=b.obj&&b.obj.k==='c'&&dist2(b.x,b.y,b.obj.x,b.obj.y)<500;
      if(dist2(b.x,b.y,b.lx,b.ly)<4&&!b.target&&!crateWork){b.stuckT++;if(b.stuckT>2){if(b.goalId)b.avoid.add(b.goalId);b.goalId=null;b.obj=null;const an=Math.random()*TAU;b.gx=clamp(b.x+Math.cos(an)*130,20,MAP-20);b.gy=clamp(b.y+Math.sin(an)*130,20,MAP-20);b.stuckT=0;}}else b.stuckT=0;
      b.lx=b.x;b.ly=b.y;
    }
    let tgt=null;
    if(b.target){if(b.target===uid){if(me.st==='alive')tgt=me;}else if(b.target[0]==='b'){const o=bots.find(o=>'b'+o.id===b.target);if(o&&o.st==='alive')tgt=o;}else{const h=humans.find(h=>h.uid===b.target);if(h&&h.st==='alive')tgt=h;}}
    if(!tgt)b.target=null;
    let mx=0,my=0;const W=WEAP[b.w],spd=SPEED*.9*W.slow*(b.useT>0?.5:1);
    const shoot=a=>{
      if(b.fireCD>0||b.reloadT>0||b.useT>0)return;
      b.fireCD=1/(W.rate*.55)+Math.random()*.15;
      if(W.mag){b.ammo--;if(b.ammo<=0){b.reloadT=W.rl;b.ammo=W.mag;}}
      const x=b.x+Math.cos(b.a)*8,y=b.y+Math.sin(b.a)*8,id=++botShotId;
      botShots.push({id,b:b.id,x,y,a,w:b.w,r:b.r,t:now()});spawnBullets('b'+b.id,x,y,a,b.w,b.r);
    };
    if(tgt){
      const dx=tgt.x-b.x,dy=tgt.y-b.y,d=Math.hypot(dx,dy)||1;b.a=Math.atan2(dy,dx);
      const want=b.w===0?6:W.range*.5;
      if(d>want+15){mx+=dx/d;my+=dy/d;}else if(d<want-15){mx-=dx/d;my-=dy/d;}
      mx+=-dy/d*b.strafe*.7;my+=dx/d*b.strafe*.7;
      if(d<W.range+6)shoot(b.a+(Math.random()-.5)*.32+(W.pel>1?0:(Math.random()-.5)*2*W.spread));
    }else{
      const dx=b.gx-b.x,dy=b.gy-b.y,d=Math.hypot(dx,dy);
      if(b.obj&&b.obj.k==='c'&&!taken.has(b.obj.o.id)&&d<20){b.a=Math.atan2(dy,dx);shoot(b.a);}
      else if(b.obj&&b.obj.k==='h'&&d<16){openChest(b.obj.o);b.obj=null;}
      else if(d>3){const [wx,wy]=waypoint(b),ex=wx-b.x,ey=wy-b.y,ed=Math.hypot(ex,ey)||1;mx=ex/ed;my=ey/ed;b.a=Math.atan2(my,mx);}
    }
    const ml=Math.hypot(mx,my);if(ml>0){b.x+=mx/ml*spd*dt;b.y+=my/ml*spd*dt;}
    collide(b,PR);
    for(const L of lootables){if(dist2(b.x,b.y,L.x,L.y)<110){
      if(isW(L.c)){const w=cW(L.c),r=cR(L.c);if(wScore(w,r)>wScore(b.w,b.r)){b.w=w;b.r=r;b.ammo=WEAP[w].mag;taken.add(L.id);tkDirty=true;}}
      else if(L.c<=2&&b.heals<3){b.heals++;taken.add(L.id);tkDirty=true;}
      else if(L.c>=3&&b.sh<100){b.sh=Math.min(100,b.sh+(L.c===3?40:50));taken.add(L.id);tkDirty=true;}
    }}
    if(dist2(b.x,b.y,storm.cx,storm.cy)>storm.r*storm.r){b.hp-=storm.dmg*dt;if(b.hp<=0)killBot(b,'storm');}
  }
}
function damageBot(b,d,by){if(b.st!=='alive')return;if(b.sh>0){const a=Math.min(b.sh,d);b.sh-=a;d-=a;}b.hp-=d;b.useT=0;if(b.hp<=0)killBot(b,by);}
function killBot(b,by){
  b.st='dead';b.hp=0;bk.push([b.id,by]);bkDirty=true;
  if(b.w){botDrops.push(['b'+b.id+'w'+G.id,Math.round(b.x),Math.round(b.y),100+b.w*10+b.r]);bdDirty=true;}
  if(b.heals){botDrops.push(['b'+b.id+'m'+G.id,Math.round(b.x+12),Math.round(b.y),2]);bdDirty=true;}
}
function decodeBots(arr){return(arr||[]).filter(Array.isArray).map(a=>({id:+a[0]|0,x:+a[1]||0,y:+a[2]||0,a:(+a[3]||0)/100,hp:+a[4]||0,st:STI[a[5]]||'dead',w:clamp(+a[6]|0,0,6),r:clamp(+a[7]|0,0,4),sh:+a[8]||0}));}
function becomeHost(prev){
  if(prev&&Array.isArray(prev.mt)&&prev.mt[0]===G.id){
    if(prev.bots){bots=decodeBots(prev.bots).map(b=>mkBot(b.id,{x:b.x,y:b.y,a:b.a,hp:b.hp,sh:b.sh,st:b.st,w:b.w,r:b.r,ammo:WEAP[b.w].mag,dropT:el()+Math.random()*4,gx:b.x,gy:b.y,fallT:b.st==='fall'?1:0}));botsSpawned=true;}
    if(Array.isArray(prev.bk))bk=prev.bk.filter(Array.isArray).slice(0,40);
    if(Array.isArray(prev.bd))botDrops=prev.bd.filter(Array.isArray).slice(0,40);
    bkDirty=bdDirty=true;
  }else if(el()>=PRE)botsSpawned=true;
}

// ---------- world view
let humans=[],viewBots=[],lootables=[],aliveCount=0,storm=stormAt(1,-99),specTarget=null,online=1;
function cycleSpec(){const list=combatants().filter(c=>c.st==='alive');if(!list.length)return;const i=list.findIndex(c=>c.id===specTarget);specTarget=list[(i+1)%list.length].id;}
function combatants(){
  const out=[];
  if(playing&&(me.st==='alive'||me.st==='fall'))out.push({id:uid,x:me.x,y:me.y,st:me.st});
  for(const h of humans)out.push({id:h.uid,x:h.x,y:h.y,st:h.st});
  for(const b of viewBots)out.push({id:'b'+b.id,x:b.x,y:b.y,st:b.st});
  return out;
}

// ---------- main update
let lastFrame=now(),lastPub=0,pubTick=0,lastHud=0,lastMini=0,wasHost=false,lastUpd=now(),nearLoot=null,nearChest=null;
const myPres={};
function update(dt){
  const t=now(),dnow=Date.now();
  if(t-lastUpd>1000)isHost=false;
  lastUpd=t;
  const peers=room?room.peers():[];
  myPeer=null;for(const p of peers)if(p.sameTab){myPeer=p.peer;break;}
  let elected=null;
  if(!room){if(roomTried||t>3000)elected='me';}
  else if(t>=syncUntil){
    let best=null;
    for(const p of peers){if(p.kind!=='viewer')continue;const pr=p.presence;if(!pr||pr.v!==2)continue;
      if(!p.sameTab&&(dnow-p.updatedAt>1500||!pr.vis))continue;if(p.sameTab&&document.hidden)continue;
      if(!best||p.peer<best.peer)best=p;}
    elected=best?(best.sameTab?'me':best):'me';
  }
  const nowHost=elected==='me';
  hostPeer=(elected&&elected!=='me')?elected:null;
  if(nowHost&&!isHost){isHost=true;becomeHost(lastHostPres);}
  else if(!nowHost&&isHost){isHost=false;bots=[];botShots=[];}
  if(hostPeer)lastHostPres=hostPeer.presence;
  if(!isHost){
    let src=hostPeer&&hostPeer.presence;
    if(!src||!Array.isArray(src.mt)){src=null;for(const p of peers){if(!p.sameTab&&p.presence&&p.presence.v===2&&Array.isArray(p.presence.mt)&&dnow-p.updatedAt<1500){src=p.presence;break;}}}
    if(src){const [id,e10,ph,wu,wn,ee]=src.mt;const id_=+id|0,e=(+e10||0)/10;
      if(id_!==G.id)newMatch(id_,e);
      else{const drift=el()-e;if(Math.abs(drift)>.3)G.start=t-e*1000;}
      G.ph=ph?1:0;G.winU=String(wu||'');G.winN=clean(wn);G.endEl=(+ee||0)/10;}
  }
  const e=el();
  storm=stormAt(G.id,e-PRE-SHIP);
  humans=[];nameMap=new Map();online=0;
  const seenKeys=new Set();
  for(const p of peers){
    if(p.kind!=='viewer')continue;const pr=p.presence;if(!pr||pr.v!==2)continue;online++;
    if(p.sameTab)continue;
    if(typeof pr.u==='string')nameMap.set(pr.u,clean(pr.n)||'PLAYER');
    if(pr.m!==G.id)continue;
    const st=['ship','fall','alive','dead','wait','spec','menu'].includes(pr.st)?pr.st:'menu';
    let r=R.get(p.peer);const tx=+pr.x||0,ty=+pr.y||0;
    if(!r){r={x:tx,y:ty,a:0};R.set(p.peer,r);}
    if(Math.abs(r.x-tx)>90||Math.abs(r.y-ty)>90){r.x=tx;r.y=ty;}
    r.x+=(tx-r.x)*Math.min(1,dt*14);r.y+=(ty-r.y)*Math.min(1,dt*14);
    seenKeys.add(p.peer);
    const h={peer:p.peer,uid:String(pr.u||p.peer),name:clean(pr.n)||'PLAYER',col:COLORS[(+pr.c|0)%COLORS.length]||COLORS[0],x:r.x,y:r.y,a:(+pr.a||0)/100,hp:+pr.hp||0,sh:+pr.sh||0,st,w:clamp(+pr.w|0,0,6),r:clamp(+pr.r|0,0,4),kb:pr.kb,pr};
    humans.push(h);
    if(Array.isArray(pr.s))ingest(p.peer+':s',h.uid,pr.s,false);
    if(Array.isArray(pr.tk)){for(const id of pr.tk)if(typeof id==='string'&&!taken.has(id)){taken.add(id);tkDirty=true;}}
    const ps=prevSt.get(h.uid);if(ps&&ps!=='dead'&&st==='dead'){feed(nameOf(h.kb),h.name,h.kb===uid);burst(h.x,h.y,h.col,20);if(h.kb===uid){beep(880,.08,'triangle');setTimeout(()=>beep(1320,.12,'triangle'),70);}}
    prevSt.set(h.uid,st);
  }
  if(!online)online=1;
  for(const k of R.keys())if(!k.startsWith('b')&&!seenKeys.has(k))R.delete(k);
  if(isHost)viewBots=bots;
  else{
    const hp=hostPeer&&hostPeer.presence;
    if(hp&&Array.isArray(hp.mt)&&hp.mt[0]===G.id){
      viewBots=decodeBots(hp.bots).map(b=>{let r=R.get('b'+b.id);if(!r||Math.abs(r.x-b.x)>90||Math.abs(r.y-b.y)>90){r={x:b.x,y:b.y};R.set('b'+b.id,r);}r.x+=(b.x-r.x)*Math.min(1,dt*14);r.y+=(b.y-r.y)*Math.min(1,dt*14);return Object.assign(b,{x:r.x,y:r.y});});
      if(Array.isArray(hp.bs))ingest(hostPeer.peer+':bs','',hp.bs,true);
      if(Array.isArray(hp.bk))bk=hp.bk.filter(Array.isArray);
      if(Array.isArray(hp.bd))botDrops=hp.bd.filter(Array.isArray);
    }else viewBots=[];
  }
  for(const b of viewBots){const k='b'+b.id,ps=prevSt.get(k);if(ps&&ps!=='dead'&&b.st==='dead'){const e2=bk.find(x=>x[0]===b.id);const by=e2?String(e2[1]):'?';feed(nameOf(by),nameOf(k),by===uid);burst(b.x,b.y,COLORS[b.id%COLORS.length],18);if(by===uid){beep(880,.08,'triangle');setTimeout(()=>beep(1320,.12,'triangle'),70);}}prevSt.set(k,b.st);}
  lootables=[];
  for(const L of loot)if(!taken.has(L.id))lootables.push(L);
  for(const [oid,items] of contents){if(!taken.has(oid))continue;for(const L of items)if(!taken.has(L.id))lootables.push(L);}
  const addDrops=arr=>{for(const d of arr||[]){if(!Array.isArray(d))continue;const id=String(d[0]);if(taken.has(id))continue;const c=+d[3]|0;if(!((c>=1&&c<=4)||(isW(c)&&cW(c)>=1&&cW(c)<=6&&cR(c)<=4)))continue;lootables.push({id,x:+d[1]||0,y:+d[2]||0,c});}};
  addDrops(myDrops);addDrops(botDrops);for(const h of humans)addDrops(h.pr.dr);
  aliveCount=0;
  if(playing&&['ship','fall','alive'].includes(me.st))aliveCount++;
  for(const h of humans)if(['ship','fall','alive'].includes(h.st))aliveCount++;
  for(const b of viewBots)if(b.st!=='dead')aliveCount++;
  let k=0;for(const h of humans)if(h.st==='dead'&&h.kb===uid)k++;for(const x of bk)if(x[1]===uid)k++;me.kills=k;

  updateMe(dt,e);
  if(isHost){hostLogic(e);if(G.ph===0)updateBots(dt,e,storm,humans);}
  updateBullets(dt);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  for(const n of nums){n.y-=18*dt;n.t-=dt;}nums=nums.filter(n=>n.t>0);
  const ct=now();myShots=myShots.filter(s=>ct-s.t<1200).slice(-14);botShots=botShots.filter(s=>ct-s.t<1200).slice(-24);
  if(hurtT>0){hurtT-=dt;if(hurtT<=0)$('hurt').style.opacity=0;}
  if(ct-lastPub>50){lastPub=ct;publish();}
  if(ct-lastHud>100){lastHud=ct;hud(e);}
  wasHost=isHost;
}
function ingest(key,owner,list,isBot){
  let seen=shotSeen.get(key);
  let mx=0;for(const s of list)if(Array.isArray(s))mx=Math.max(mx,+s[0]||0);
  if(seen===undefined||mx<seen-50){shotSeen.set(key,mx);return;}
  for(const s of list){if(!Array.isArray(s))continue;const id=+s[0]||0;if(id<=seen)continue;
    if(isBot)spawnBullets('b'+(+s[1]|0),+s[2]||0,+s[3]||0,(+s[4]||0)/1000,clamp(+s[5]|0,0,6),clamp(+s[6]|0,0,4));
    else spawnBullets(owner,+s[1]||0,+s[2]||0,(+s[3]||0)/1000,clamp(+s[4]|0,0,6),clamp(+s[5]|0,0,4));}
  shotSeen.set(key,Math.max(seen,mx));
}
function hostLogic(e){
  if(G.ph===0){
    if(e>=PRE&&!botsSpawned){let hum=0;if(playing&&['wait','ship'].includes(me.st))hum++;for(const h of humans)if(['wait','ship'].includes(h.st))hum++;spawnBots(clamp(16-hum,4,15));}
    if(e>=PRE+1.5){
      let ah=0,ab=0,last=null;
      if(playing&&['ship','fall','alive'].includes(me.st)){ah++;last={u:uid,n:myName};}
      for(const h of humans)if(['ship','fall','alive'].includes(h.st)){ah++;last={u:h.uid,n:h.name};}
      for(const b of bots)if(b.st!=='dead'){ab++;last={u:'b'+b.id,n:nameOf('b'+b.id)};}
      if(ah===0||ah+ab<=1){G.ph=1;G.endEl=e;if(ah+ab===1&&last){G.winU=last.u;G.winN=last.n;}else{G.winU='';G.winN='';}}
    }
  }else if(e-G.endEl>=ENDT){newMatch(G.id+1,0);}
}
function updateMe(dt,e){
  me.fireCD-=dt;if(me.flash>0)me.flash-=dt;
  if(!playing)return;
  const sx=(me.x-cam.x)*S,sy=(me.y-cam.y)*S;
  if(me.st==='alive'||me.st==='fall')me.a=Math.atan2(mouse.y-sy,mouse.x-sx);
  let mx=0,my=0;
  if(keys.w||keys.arrowup)my--;if(keys.s||keys.arrowdown)my++;if(keys.a||keys.arrowleft)mx--;if(keys.d||keys.arrowright)mx++;
  if(joy.id!==null){mx+=joy.dx;my+=joy.dy;}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  if(me.st==='wait'&&e>=PRE&&G.ph===0){me.st='ship';resetLoadout();}
  nearLoot=null;nearChest=null;
  if(me.st==='ship'){
    const k=clamp((e-PRE)/SHIP,0,1);me.x=lerp(ship.ax,ship.bx,k);me.y=lerp(ship.ay,ship.by,k);
    const inside=me.x>40&&me.y>40&&me.x<MAP-40&&me.y<MAP-40;
    if(inside)me.wasIn=true;
    if((wantJump&&inside)||k>=1||(me.wasIn&&!inside)){me.st='fall';me.fallT=FALL;me.x=clamp(me.x,50,MAP-50);me.y=clamp(me.y,50,MAP-50);beep(500,.3,'triangle',.06,.4);}
  }else if(me.st==='fall'){
    me.x+=mx*SPEED*1.7*dt;me.y+=my*SPEED*1.7*dt;me.x=clamp(me.x,10,MAP-10);me.y=clamp(me.y,10,MAP-10);
    me.fallT-=dt;if(me.fallT<=0){me.st='alive';collide(me,PR);burst(me.x,me.y,'#d8c79a',10);noise(.15,.08,500);}
  }else if(me.st==='alive'){
    const W=WEAP[curW()],sp=SPEED*W.slow*(me.useT>0?.45:1);me.x+=mx*sp*dt;me.y+=my*sp*dt;collide(me,PR);
    if(me.reloadT>0){me.reloadT-=dt;if(me.reloadT<=0){const s=curSlot();if(s)s.ammo=WEAP[s.w].mag;beep(500,.04);}}
    if(me.useT>0){me.useT-=dt;if(me.useT<=0)finishUse();}
    if(mouse.down&&G.ph===0)tryFire();
    let nd=16*16;

  const merged=Object.assign({},myPres,p);for(const k in merged)if(merged[k]===null)delete merged[k];
  let size=JSON.stringify(merged).length;

  if(d.w===0){const p=clamp(1-(T-(punchAt.get(d.id)||0))/180,0,1),side=((punchAt.get(d.id)||0)/400|0)%2;
    circ(5.5+(side?0:p*6),-5.5,2.5,body,dark,1.2);circ(5.5+(side?p*6:0),5.5,2.5,body,dark,1.2);}
  else{circ(5,2.2,2.4,body,dark,1.1);circ(5+W.len*.55,-.4,2.4,body,dark,1.1);}
  ctx.restore();
  if(d.bot){ctx.strokeStyle=dark;ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(x,y-PR);ctx.lineTo(x,y-PR-3);ctx.stroke();circ(x,y-PR-3.6,1.2,'#ff5a5a');}
}
function drawFaller(d){
  const x=d.x,y=d.y;
  circ(x+6,y+14,PR*.8,'rgba(0,0,0,.18)');
  ctx.strokeStyle='#eee';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(x-PR,y-1);ctx.lineTo(x-14,y-16);ctx.moveTo(x+PR,y-1);ctx.lineTo(x+14,y-16);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y-14,15,Math.PI,0);ctx.closePath();ctx.fillStyle=d.col;ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle='#1d1d22';ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x,y-14,15,Math.PI,Math.PI*1.33);ctx.lineTo(x,y-14);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x,y-14,15,Math.PI*1.66,0);ctx.lineTo(x,y-14);ctx.fill();
  circ(x,y,PR,d.col,'#1d1d22',1.5);
}
function drawShip(x,y,a,T){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(10,22,34,10,0,0,TAU);ctx.fill();
  rr(-30,-30,22,60,6,'#d9dde6','#3a3f4a',2);
  rr(-40,-9,82,18,9,'#eef1f6','#3a3f4a',2);
  ctx.fillStyle='#e0533f';ctx.fillRect(-36,-2,70,4);
  rr(-44,-14,10,28,3,'#d9dde6','#3a3f4a',1.6);
  for(let i=0;i<5;i++)circ(-18+i*9,-4.5,1.8,'#7cc4ff','#3a3f4a',.8);
  rr(30,-5,8,10,4,'#7cc4ff','#3a3f4a',1.2);
  const sp=(T/40)%TAU;ctx.strokeStyle='#3a3f4a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-19+Math.cos(sp)*2,-28);ctx.lineTo(-19-Math.cos(sp)*2,-34);ctx.moveTo(-19+Math.cos(sp)*2,28);ctx.lineTo(-19-Math.cos(sp)*2,34);ctx.stroke();
  ctx.restore();
}
function drawLoot(L,T){
  const x=L.x,y=L.y+Math.sin(T/300+L.x)*.8;
  if(isW(L.c)){const w=cW(L.c),r=cR(L.c),col=RAR[r].c;
    circ(x,y,9,'rgba(0,0,0,.28)');circ(x,y,9,null,col,1.6);
    if(r>=3){ctx.globalAlpha=.25+.15*Math.sin(T/200);circ(x,y,11.5,null,col,2);ctx.globalAlpha=1;}
    ctx.save();ctx.translate(x-WEAP[w].len*.42-3,y);drawGun(w,r,WEAP[w].len*.85);ctx.restore();
  }else{
    circ(x,y,8,'rgba(0,0,0,.28)');circ(x,y,8,null,'#fff8',1.2);
    if(L.c===1){rr(x-5,y-2.5,10,5,1.5,'#f2e2c4','#7a6a4a',1);ctx.fillStyle='#d8c39b';ctx.fillRect(x-1,y-2.5,2,5);}
    else if(L.c===2){rr(x-4.5,y-4,9,8,1.5,'#fff','#555',1);ctx.fillStyle='#e33';ctx.fillRect(x-1,y-3,2,6);ctx.fillRect(x-3,y-1,6,2);}
    else if(L.c===3){rr(x-2.5,y-4.5,5,9,2,'#7ec8ff','#1f5c9e',1);ctx.fillStyle='#d6eeff';ctx.fillRect(x-1,y-4,2,2);}
    else{rr(x-4,y-5,8,10,2.5,'#3f8fff','#173d7a',1.2);ctx.fillStyle='#bfe0ff';ctx.fillRect(x-1.2,y-4,2.4,3);}
  }
}
const mm=$('mm'),mctx=mm.getContext('2d');
function drawMini(e){
  const s=150/MAP;mctx.fillStyle='#3b8fd6';mctx.fillRect(0,0,150,150);mctx.fillStyle='#77c25a';mctx.fillRect(0,0,150,150);
  mctx.fillStyle='#c9b17a';for(const rd of M.roads){if(rd.h)mctx.fillRect(0,rd.p*s-1,150,2);else mctx.fillRect(rd.p*s-1,0,2,150);}
  for(const b of M.bld){mctx.fillStyle=b.col;mctx.fillRect(b.x*s,b.y*s,b.w*s,b.h*s);}
  if(e>PRE){mctx.fillStyle='rgba(120,40,190,.45)';mctx.beginPath();mctx.rect(0,0,150,150);mctx.arc(storm.cx*s,storm.cy*s,Math.max(0,storm.r*s),0,TAU,true);mctx.fill('evenodd');
    mctx.strokeStyle='#fff';mctx.lineWidth=1;mctx.setLineDash([3,2]);mctx.beginPath();mctx.arc(storm.nx*s,storm.ny*s,storm.nr*s,0,TAU);mctx.stroke();mctx.setLineDash([]);}
  if(G.ph===0&&e<PRE+SHIP){mctx.strokeStyle='#ffd84a';mctx.lineWidth=2;mctx.beginPath();mctx.moveTo(ship.ax*s,ship.ay*s);mctx.lineTo(ship.bx*s,ship.by*s);mctx.stroke();}
  if(playing){let x=me.x,y=me.y;if(me.st==='dead'||me.st==='spec'){const c=combatants().find(c=>c.id===specTarget);if(c){x=c.x;y=c.y;}}
    mctx.beginPath();mctx.arc(x*s,y*s,4,0,TAU);mctx.fillStyle=COLORS[myColor];mctx.fill();mctx.lineWidth=1.5;mctx.strokeStyle='#000';mctx.stroke();}
}

// ---------- HUD
const fmt=s=>{s=Math.max(0,Math.ceil(s));return(s/60|0)+':'+String(s%60).padStart(2,'0');};
function setSub(lines){const cs=$('csub');cs.textContent='';lines.forEach((l,i)=>{if(i)cs.appendChild(document.createElement('br'));cs.appendChild(document.createTextNode(l));});}
function hud(e){
  const net=$('net');
  if(!roomTried){net.textContent='Connecting…';net.style.color='#ccc';}
  else if(room){net.textContent=online+' player'+(online===1?'':'s')+' online · multiplayer on';net.style.color='#8f8';}
  else{net.textContent='Offline · solo vs bots';net.style.color='#fc8';}
  if(!playing)return;
  $('alive').textContent=aliveCount;$('kills').textContent=me.kills;$('online').textContent=online;
  const st=$('stormtxt');
  if(G.ph===0&&e>PRE+SHIP-1){st.classList.remove('hide');st.textContent=storm.state==='hold'?'⚡ Storm closes in '+fmt(storm.left):storm.state==='shrink'?'⚡ Storm closing '+fmt(storm.left):'⚡ Final storm';}else st.classList.add('hide');
  const hp=clamp(me.hp,0,100);$('hpb').style.width=hp+'%';$('hpt').textContent=Math.ceil(hp)+(me.sh>0?'  +'+Math.ceil(me.sh):'');$('shb').style.width=clamp(me.sh,0,100)+'%';
  for(let i=0;i<4;i++){const el_=$('s'+i),s=me.slots[i];el_.classList.toggle('on',me.cur===i);el_.textContent='';
    const k=document.createElement('span');k.className='k';k.textContent=i+1;el_.appendChild(k);
    const n=document.createElement('div');n.className='nm';n.textContent=s?WEAP[s.w].s:(me.cur===i?'FISTS':'');el_.appendChild(n);
    el_.style.background=s?'linear-gradient(transparent 40%,'+RAR[s.r].c+'66)':'';el_.style.borderColor=me.cur===i?'#fff':(s?RAR[s.r].c+'aa':'');
    if(s){const a=document.createElement('div');a.className='am';a.textContent=(me.reloadT>0&&me.cur===i)?'reloading':s.ammo+' / '+WEAP[s.w].mag;el_.appendChild(a);}}
  $('cb').textContent=me.inv[1];$('cm').textContent=me.inv[2];$('cs').textContent=me.inv[3];$('cg').textContent=me.inv[4];
  let prog=0,pl='';if(me.useT>0){prog=1-me.useT/me.useMax;pl='Using '+CONS[me.useK].n.toLowerCase()+'…';}else if(me.reloadT>0){const s=curSlot();prog=s?1-me.reloadT/(WEAP[s.w].rl*(1-.06*s.r)):0;pl='Reloading…';}
  $('prog').style.visibility=prog>0?'visible':'hidden';$('progb').style.width=(prog*100)+'%';$('progl').textContent=pl;
  const pr=$('prompt');pr.textContent='';
  if(me.st==='alive'&&(nearLoot||nearChest)){const s=document.createElement('span');const i=document.createElement('i');i.textContent='E';s.appendChild(i);
    if(nearLoot){s.appendChild(document.createTextNode(me.slots.includes(null)?'Pick up ':'Swap for '));const b=document.createElement('b');b.textContent=itemName(nearLoot.c);b.style.color=RAR[cR(nearLoot.c)].c;s.appendChild(b);}
    else s.appendChild(document.createTextNode('Open chest'));pr.appendChild(s);}
  let c='',sub=[];
  if(G.ph===1){
    if(G.winU===uid){c='#1 VICTORY!';sub=[me.kills+' eliminations'];}
    else{c=G.winN?G.winN+' wins!':'Match over';sub=[(me.place?'You placed #'+me.place+' · ':'')+me.kills+' eliminations'];}
    sub.push('Next match in '+Math.max(0,Math.ceil(ENDT-(e-G.endEl)))+'s');
  }else if(me.st==='wait'){c='Get ready!';sub=['Drop ship takes off in '+Math.max(0,Math.ceil(PRE-e))+'s',online+' player'+(online===1?'':'s')+' here + bots'];}
  else if(me.st==='dead'){c='Eliminated';sub=['by '+nameOf(me.kb)+' · #'+me.place,'Spectating — click to switch player'];}
  else if(me.st==='spec'){c='Match in progress';sub=['Spectating · you join next round',aliveCount+' left'];}
  $('cmsg').textContent=c;setSub(sub);
  $('tJump').style.display=me.st==='ship'?'flex':'none';
}

// ---------- loop
function frame(){
  const t=now();let dt=(t-lastFrame)/1000;lastFrame=t;if(dt>.05)dt=.05;
  try{update(dt);render();}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
